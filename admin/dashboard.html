<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Новый пост блога — Elite K9 Group</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        background: #f4f5f3;
        font-family: 'Outfit', Arial, sans-serif;
        color: #222;
    }
    header {
        background: #1d2b22;
        color: #fff;
        padding: 18px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    header h1 { font-size: 1.1rem; margin: 0; font-weight: 600; }
    header button {
        background: transparent;
        border: 1px solid rgba(255,255,255,0.4);
        color: #fff;
        padding: 7px 14px;
        border-radius: 7px;
        cursor: pointer;
        font-size: 0.85rem;
    }
    main {
        max-width: 720px;
        margin: 32px auto;
        padding: 0 20px 60px;
    }
    .field {
        background: #fff;
        border-radius: 12px;
        padding: 18px 20px;
        margin-bottom: 16px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    label {
        display: block;
        font-weight: 600;
        font-size: 0.9rem;
        margin-bottom: 8px;
        color: #333;
    }
    .hint {
        font-size: 0.8rem;
        color: #888;
        margin: -4px 0 10px;
    }
    input[type=text], textarea {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 1rem;
        font-family: inherit;
        resize: vertical;
    }
    textarea#bodyText { min-height: 260px; line-height: 1.5; }
    input:focus, textarea:focus { outline: none; border-color: #f9700f; }
    #imagePreview {
        margin-top: 12px;
        max-width: 260px;
        border-radius: 8px;
        display: none;
    }
    .submit-row { display: flex; align-items: center; gap: 16px; }
    button.publish {
        padding: 13px 28px;
        background: #f9700f;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
    }
    button.publish:disabled { opacity: 0.6; cursor: default; }
    .status { font-size: 0.92rem; }
    .status.ok { color: #1e7a34; }
    .status.err { color: #b3261e; }
    .status a { color: #1e7a34; font-weight: 600; }
</style>
</head>
<body>
    <header>
        <h1>Elite K9 Group — Новый пост блога</h1>
        <button id="logoutBtn">Выйти</button>
    </header>
    <main>
        <form id="postForm">
            <div class="field">
                <label for="title">Заголовок поста</label>
                <input type="text" id="title" required placeholder="Например: Как выбрать щенка немецкой овчарки">
            </div>
            <div class="field">
                <label for="category">Категория</label>
                <div class="hint">Короткий ярлык, например "Puppy Training" или "Health & Care"</div>
                <input type="text" id="category" placeholder="Dog Training">
            </div>
            <div class="field">
                <label for="excerpt">Краткое описание</label>
                <div class="hint">Показывается в списке блогов и в соцсетях. Необязательно — если оставить пустым, возьму начало текста.</div>
                <input type="text" id="excerpt" maxlength="160">
            </div>
            <div class="field">
                <label for="image">Главная картинка</label>
                <input type="file" id="image" accept="image/png, image/jpeg, image/webp" required>
                <img id="imagePreview" alt="">
            </div>
            <div class="field">
                <label for="bodyText">Текст поста</label>
                <div class="hint">Пустая строка — новый абзац. **текст** — жирный. Строки, начинающиеся с "- " — становятся списком.</div>
                <textarea id="bodyText" required placeholder="Первый абзац...

Второй абзац с **важным** словом.

- Пункт списка
- Ещё пункт"></textarea>
            </div>
            <div class="submit-row">
                <button type="submit" class="publish" id="publishBtn">Опубликовать</button>
                <span class="status" id="statusMsg"></span>
            </div>
        </form>
    </main>

<script>
(async function guard() {
    try {
        const res = await fetch('/api/check-session');
        const data = await res.json();
        if (!data.authenticated) window.location.href = '/admin/index.html';
    } catch {
        window.location.href = '/admin/index.html';
    }
})();

document.getElementById('logoutBtn').addEventListener('click', async () => {
    await fetch('/api/logout', { method: 'POST' });
    window.location.href = '/admin/index.html';
});

const imageInput = document.getElementById('image');
const imagePreview = document.getElementById('imagePreview');
let resizedImage = null; // { base64, mime }

imageInput.addEventListener('change', async () => {
    const file = imageInput.files[0];
    if (!file) { resizedImage = null; imagePreview.style.display = 'none'; return; }
    resizedImage = await resizeImage(file, 1600, 0.82);
    imagePreview.src = 'data:' + resizedImage.mime + ';base64,' + resizedImage.base64;
    imagePreview.style.display = 'block';
});

function resizeImage(file, maxWidth, quality) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        const reader = new FileReader();
        reader.onload = () => { img.src = reader.result; };
        reader.onerror = reject;
        img.onload = () => {
            const scale = Math.min(1, maxWidth / img.width);
            const w = Math.round(img.width * scale);
            const h = Math.round(img.height * scale);
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            const mime = 'image/jpeg';
            const dataUrl = canvas.toDataURL(mime, quality);
            resolve({ base64: dataUrl.split(',')[1], mime });
        };
        img.onerror = reject;
        reader.readAsDataURL(file);
    });
}

const form = document.getElementById('postForm');
const publishBtn = document.getElementById('publishBtn');
const statusMsg = document.getElementById('statusMsg');

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    statusMsg.textContent = '';
    statusMsg.className = 'status';

    if (!resizedImage) {
        statusMsg.textContent = 'Добавьте картинку';
        statusMsg.className = 'status err';
        return;
    }

    publishBtn.disabled = true;
    publishBtn.textContent = 'Публикуем...';

    try {
        const res = await fetch('/api/publish', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                title: document.getElementById('title').value,
                category: document.getElementById('category').value,
                excerpt: document.getElementById('excerpt').value,
                bodyText: document.getElementById('bodyText').value,
                imageBase64: resizedImage.base64,
                imageMime: resizedImage.mime,
            }),
        });
        const data = await res.json();
        if (res.ok && data.ok) {
            statusMsg.innerHTML = 'Готово! <a href="' + data.url + '" target="_blank">Открыть пост</a> (появится на сайте через 1-2 минуты)';
            statusMsg.className = 'status ok';
            form.reset();
            imagePreview.style.display = 'none';
            resizedImage = null;
        } else {
            statusMsg.textContent = 'Ошибка: ' + (data.error || 'неизвестная');
            statusMsg.className = 'status err';
        }
    } catch (err) {
        statusMsg.textContent = 'Ошибка сети, попробуйте ещё раз';
        statusMsg.className = 'status err';
    } finally {
        publishBtn.disabled = false;
        publishBtn.textContent = 'Опубликовать';
    }
});
</script>
</body>
</html>
